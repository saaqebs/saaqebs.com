  <script>
    // Freeze the mobile front-page height (--front-h) to the viewport height
    // measured once at load. Mobile browsers resize the viewport when their
    // navigation bars show/hide during scroll, which made the hero photo
    // resize mid-scroll. Re-measure only when the width changes (rotation),
    // never on height-only changes (browser chrome showing/hiding).
    (function () {
      var w = window.innerWidth;
      function setFrontH() {
        document.documentElement.style.setProperty('--front-h', window.innerHeight + 'px');
      }
      setFrontH();
      window.addEventListener('resize', function () {
        if (window.innerWidth !== w) {
          w = window.innerWidth;
          setFrontH();
        }
      });
      window.addEventListener('orientationchange', setFrontH);
    })();
  </script>
